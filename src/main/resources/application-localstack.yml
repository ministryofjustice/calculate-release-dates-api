domain-events-sqs:
  provider: localstack
  endpoint.url: http://localhost:4566
  queue.name: rp_api_queue
  dlq.name: rp_api_dlq

domain-events-sns:
  provider: localstack

hmpps.sqs:
  reactiveApi: true
  provider: localstack
  queues:
    bulkcomparison:
      queueName: "bulkcomparison"
      dlqName: "bulkcomparison-dlq"
      dlqMaxReceiveCount: 3
      visibilityTimeout: 120
    prisonerevents:
      queueName: "prisonerevents-${random.uuid}"
      dlqName: "prisonerevents-dlq-${random.uuid}"
      subscribeTopicId: domainevents
      subscribeFilter: "{\"eventType\":[\"prison-offender-events.prisoner.merged\", \"prison-offender-events.prisoner.booking.moved\"]}"
      dlqMaxReceiveCount: 3
      visibilityTimeout: 120
crds.listeners:
  process: SQS
  concurrency: 5
